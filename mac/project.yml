name: BloodGlucoseBuddy
options:
  bundleIdPrefix: com.tanookistudios
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BloodGlucoseBuddy:
    type: application
    platform: macOS
    sources: [BloodGlucoseBuddy]
    info:
      path: BloodGlucoseBuddy/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Blood Glucose Buddy
        NSHumanReadableCopyright: MIT License
    settings:
      base:
        PRODUCT_NAME: Blood Glucose Buddy
        PRODUCT_BUNDLE_IDENTIFIER: com.tanookistudios.bloodglucosebuddy
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        OTHER_CODE_SIGN_FLAGS: --timestamp
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: NPT8NXJ7C8
  BloodGlucoseBuddyTests:
    type: bundle.unit-test
    platform: macOS
    # Pure logic is compiled straight into the tests so they never launch the menu bar app.
    sources: [Tests, BloodGlucoseBuddy/Core]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tanookistudios.bloodglucosebuddy.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
